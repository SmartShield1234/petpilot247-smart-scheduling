
name: Person 1 Snapshot Authority Tests

on:
  push:
    branches:
      - pavi-scheduling-development-handoff
    paths:
      - "test_person1_snapshot_authority.py"
      - "pavi_live_ghl_provider.py"
      - "pavi_recommendation_pipeline.py"
      - "postgres_appointment_reconciliation.py"
      - "postgres_appointment_events.py"
      - "requirements.txt"
      - ".github/workflows/person1-snapshot-tests.yml"
      - "test_person1_reconciliation_regression.py"
      - "test_person1_postgres_real_transactions.py"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-tests:
    name: Verify Person 1 Snapshot Authority
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: petpilot_test
          POSTGRES_PASSWORD: petpilot_test_only
          POSTGRES_DB: petpilot_reconciliation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petpilot_test -d petpilot_reconciliation_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    timeout-minutes: 10

    env:
      PETPILOT_LIVE_BOOKING_ENABLED: "false"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile pavi_live_ghl_provider.py
          python -m py_compile pavi_recommendation_pipeline.py
          python -m py_compile test_person1_snapshot_authority.py
          python -m py_compile postgres_appointment_reconciliation.py
          python test_person1_step69_recovery_safety.py
          python test_person1_step610_recovery_guards.py

      - name: Run snapshot authority tests
        run: |
          python test_person1_snapshot_authority.py

      - name: Run reconciliation regression tests
        run: |
          python -m unittest test_person1_reconciliation_regression -v  

      - name: Run real PostgreSQL transaction tests
        env:
          PETPILOT_DB_INTEGRATION_TEST: "1"
          PETPILOT_TEST_DATABASE_URL: "postgresql://petpilot_test:petpilot_test_only@127.0.0.1:5432/petpilot_reconciliation_test"
        run: |
          python -m unittest test_person1_postgres_real_transactions -v 
      - name: Verify Person 1 Step 3 provider wiring
        run: |
          python -m unittest -v test_person1_step3_wiring
