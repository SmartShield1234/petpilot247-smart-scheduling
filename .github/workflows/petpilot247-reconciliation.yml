
name: PetPilot247 Reconciliation

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: petpilot247-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Reconcile GHL appointments
        env:
          RECONCILIATION_KEY: ${{ secrets.PETPILOT_RECONCILIATION_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          key = os.environ.get("RECONCILIATION_KEY", "")
          if not key:
              raise SystemExit("Reconciliation secret missing")

          request = urllib.request.Request(
              "https://petpilot247-sync-dev.onrender.com/internal/reconcile-appointments",
              method="POST",
              headers={
                  "X-Reconciliation-Key": key
              },
          )

          with urllib.request.urlopen(request, timeout=240) as response:
              result = json.load(response)

          if result.get("calendars_checked") != 11:
              raise SystemExit("Calendar coverage incomplete")

          if result.get("booking_authorized") is not False:
              raise SystemExit("Unexpected booking authorization")

          if result.get("synchronization_verified") is not False:
              raise SystemExit("Unexpected sync verification state")

          print("Reconciliation completed")
          print("Calendars:", result.get("calendars_checked"))
          print("Appointments:", result.get("snapshot_count"))
          print("Inserted:", result.get("inserted"))
          print("Updated:", result.get("updated"))
          print("Booking authorized: False")
          PY
